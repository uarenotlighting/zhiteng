services:
  postgres:
    image: postgres:17-alpine
    container_name: zhiteng-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: zhiteng
      POSTGRES_PASSWORD: zhiteng
      POSTGRES_DB: zhiteng
    volumes:
      - zhiteng_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zhiteng -d zhiteng']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zhiteng-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - zhiteng_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zhiteng_pg_data:
  zhiteng_redis_data:
