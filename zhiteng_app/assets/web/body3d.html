    // A depth gesture moves along one fixed ray. All anatomical crossings
    // and the surface-region name on that ray are unchanged until placement
    // or a loaded model changes; do not raycast every mesh for every 1 cm step.
    function markerRayData(origin, direction) {
      if (markerRayCache && markerRayCache.anchor === lineAnchor &&
          markerRayCache.inward === markerInward &&
          markerRayCache.revision === anatomyRevision) return markerRayCache;
      const hits = new Map();
      for (const layer of PICK_ORDER) {
        const root = roots.get(layer);
        if (!root || (layer === 'skin' && markerSkinObject)) continue;
        raycaster.set(origin, direction);
        raycaster.far = Infinity;
        hits.set(layer, raycaster.intersectObject(root, true));
      }
      markerRayCache = {
        anchor: lineAnchor, inward: markerInward, revision: anatomyRevision, hits,
        surfaceRegion: surfaceRegionOnRay(origin, direction, lineAnchor || marker.position),
        skinBounds: new THREE.Box3().setFromObject(roots.get('skin')),
      };
      return markerRayCache;
    }

    // Describe the existing marker and tell Flutter. This function is
    // intentionally read-only with respect to marker position: changing
    // visible layers must never move a user's selected point.
    function reportMarker(source, rebuildLine = true) {
      if (!marker || !marker.visible) return false;
      const direction = markerInward && markerInward.lengthSq() > 1e-10
        ? markerInward.clone().normalize()
        : marker.position.clone().sub(camera.position).normalize();
      const anchor = lineAnchor || marker.position;
      // Start outside the shell so intersections are measured monotonically
      // from the same surface entry used by markerDepth.
      const origin = anchor.clone().addScaledVector(direction, -0.01);
      raycaster.set(origin, direction);
      raycaster.far = Infinity;
      const markerDistance = marker.position.distanceTo(origin);
      const rayData = markerRayData(origin, direction);

      let layer = 'skin';
      let meshHit = markerSkinObject ? { object: markerSkinObject } : null;
      if (!meshHit) {
        const skinHits = rayData.hits.get('skin') || [];
        if (!skinHits.length) return false;
        meshHit = skinHits[0];
      }
      if (markerDepth > SURFACE_EPSILON) {
        layer = 'muscle'; // inside, generic soft tissue until a layer is crossed
        for (const candidate of PICK_ORDER) {
          if (candidate === 'skin') continue;
          const hits = visibleLayers.has(candidate) ? rayData.hits.get(candidate) || [] : [];
          if (hits.length && hits[0].distance <= markerDistance + SURFACE_EPSILON) {
            layer = candidate;
            meshHit = hits[0];
            break;
          }
        }
      }
      const meshId = meshHit.object.userData.bodyPartId || meshHit.object.name || meshHit.object.uuid;
      const selectedLayer = meshHit.object.userData.zhitengLayer;
      let anatomicalHit = selectedLayer && selectedLayer !== 'skin' ? meshHit : null;
      if (!anatomicalHit) {
        const far = 0.01 + markerAvailableDepth + SURFACE_EPSILON;
        for (const candidate of ['muscle', 'bone', 'organ']) {
          const hit = (rayData.hits.get(candidate) || [])[0];
          if (hit && hit.distance <= far && (!anatomicalHit || hit.distance < anatomicalHit.distance)) {
            anatomicalHit = hit;
          }
        }
      }
      const anatomicalObject = anatomicalHit && anatomicalHit.object;
      const anatomicalSourceName = anatomicalObject && (
        anatomicalObject.userData.zt_source_name || anatomicalObject.name
      );
      const anatomicalStructureId = anatomicalObject && (
        anatomicalObject.userData.bodyPartId || anatomicalObject.name || anatomicalObject.uuid
      );
      const surfaceRegionObject = rayData.surfaceRegion;
      const surfaceRegionId = surfaceRegionObject && (
        surfaceRegionObject.userData.bodyPartId || surfaceRegionObject.name || surfaceRegionObject.uuid
      );
      const surfaceRegionSourceName = surfaceRegionObject && (
        surfaceRegionObject.userData.zt_source_name || surfaceRegionObject.name
      );
      const projected = marker.position.clone().project(camera);
      // Naming is based on the original skin point in body coordinates,
      // never screen Y (which changes under region framing and camera orbit).
      const skinBounds = rayData.skinBounds;
      const bodyHeight = Math.max(skinBounds.max.y - skinBounds.min.y, 0.001);
      post('pick', {
        normalizedX: Number(((projected.x + 1) / 2).toFixed(4)),
        normalizedY: Number(((1 - projected.y) / 2).toFixed(4)),
        localX: Number(marker.position.x.toFixed(4)),
        localY: Number(marker.position.y.toFixed(4)),
        localZ: Number(marker.position.z.toFixed(4)),
        depth: Number(markerDepth.toFixed(4)),
        bodyHeightFraction: (anchor.y - skinBounds.min.y) / bodyHeight,
        bodyLateralFraction: Math.abs(anchor.x - (skinBounds.min.x + skinBounds.max.x) / 2) / bodyHeight,
        meshId, bodyPartId: surfaceRegionId || meshId,
        surfaceRegionId,
        surfaceRegionSourceName,
        anatomicalStructureId,
        anatomicalSourceName,
        layer,
        source,
        view: currentView(), bodyModelVersion: modelVersion
      });
      if (rebuildLine && markerShape !== 'point') rebuildSurfaceMark();
      return true;
    }

    function pick(clientX, clientY) {
      if (pointerHitsStageControl(clientX, clientY)) return;
      if (!frameRoot()) return;
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      camera.updateWorldMatrix(true, false);
      raycaster.far = Infinity; // surface-line probes use a short 14 cm ray
      raycaster.setFromCamera(pointer, camera);
      // A tap lands on the skin (like the reference app); the depth control
      // then pushes the point inward. Inner layers are only picked directly
      // where there is no skin under the finger.
      let hit = null;
      for (const layer of ['skin', ...PICK_ORDER.filter((layer) => layer !== 'skin')]) {
        const hits = intersectLayer(layer);
        if (hits.length) { hit = hits[0]; break; }
      }
      if (!hit) return;
      ensureMarker();
      marker.visible = true;
      const direction = hit.point.clone().sub(camera.position).normalize();
      if (!placeOnRay(camera.position.clone(), direction, 0)) {
        marker.visible = false;
        updateDepthGuide();
        clearSurfaceMark();
        return;
      }
      reportMarker('tap');
    }

    // Joystick input from Flutter. dx / dy move in the screen plane. dz moves
    // along the saved placement ray (positive = deeper), independent of the
    // current camera. Metres. A move that would leave the body is
    // rejected; a surface point stays on the surface when moved in the plane
    // so it slides over the skin instead of sinking into it.
    function nudge(dx, dy, dz) {
      if (!marker || !marker.visible) return false;
      if (dz && !dx && !dy) {
        if (!lineAnchor || !markerInward) return false;
        setMarkerDepth(markerDepth + dz);
        reportMarker('depth', false);
        return true;
      }
      camera.updateWorldMatrix(true, false);
      const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0).normalize();
      const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1).normalize();
      const candidate = marker.position.clone()
        .addScaledVector(right, dx || 0)
        .addScaledVector(up, dy || 0);
      const direction = candidate.sub(camera.position);
      if (direction.lengthSq() < 1e-10) return false;
      direction.normalize();

      if (!placeOnRay(camera.position.clone(), direction, markerDepth + (dz || 0))) return false;
      reportMarker('nudge');
      return true;
    }

    function updateCrosshair() {
      const show = crosshairOn && marker && marker.visible;
      crosshairEl.style.display = show ? 'block' : 'none';
      if (!show) return;
      const projected = marker.position.clone().project(camera);
      const x = (projected.x + 1) / 2 * canvas.clientWidth;
      const y = (1 - projected.y) / 2 * canvas.clientHeight;
      crosshairH.style.top = `${y}px`;
      crosshairV.style.left = `${x}px`;
      crosshairBox.style.left = `${x}px`;
      crosshairBox.style.top = `${y}px`;
    }

    // True when a tap lands on Flutter chrome or a measured control. Those
    // widgets sit above this page, but the platform WebView can still be
    // handed the same pointer and would otherwise drop a new pain point
    // directly under the depth pad, sliders, or other tools.
    function pointerHitsStageControl(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width || canvas.clientWidth || 0;
      const height = rect.height || canvas.clientHeight || 0;
      if (width <= 0 || height <= 0) return false;
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      if (y <= stageTopChrome || y >= height - stageBottomChrome) return true;
      for (let i = 0; i < placementShields.length; i++) {
        const shield = placementShields[i];
        if (x >= shield.x && y >= shield.y &&
            x <= shield.x + shield.w && y <= shield.y + shield.h) return true;
      }
      return false;
    }

    function layoutPointerShields() {
      const host = document.getElementById('pointer-shields');
      if (!host || typeof host.replaceChildren !== 'function' ||
          typeof document.createElement !== 'function') return;
      const width = canvas.clientWidth || window.innerWidth || 0;
      const height = canvas.clientHeight || window.innerHeight || 0;
      const rects = [];
      if (stageTopChrome > 0) rects.push({ x: 0, y: 0, w: width, h: stageTopChrome });
      if (stageBottomChrome > 0) {
        rects.push({
          x: 0,
          y: Math.max(0, height - stageBottomChrome),
          w: width,
          h: stageBottomChrome,
        });
      }
      for (let i = 0; i < placementShields.length; i++) rects.push(placementShields[i]);
      host.replaceChildren(...rects.filter((rect) => rect.w >= 1 && rect.h >= 1).map((rect) => {
        const node = document.createElement('div');
        node.style.cssText =
          'position:absolute;left:' + rect.x + 'px;top:' + rect.y + 'px;width:' +
          rect.w + 'px;height:' + rect.h + 'px;';
        return node;
      }));
    }

    let dragging = false;
    let startX = 0;
    let startY = 0;
    canvas.addEventListener('pointerdown', (event) => {
      if (pointerHitsStageControl(event.clientX, event.clientY)) {
        dragging = false;
        return;
      }
      dragging = true;
      startX = event.clientX;
      startY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointercancel', () => { dragging = false; });
    canvas.addEventListener('pointerup', (event) => {
      if (!dragging) return;
      dragging = false;
      if (placementEnabled &&
          !pointerHitsStageControl(event.clientX, event.clientY) &&
          Math.hypot(event.clientX - startX, event.clientY - startY) < 6) {
        pick(event.clientX, event.clientY);
      }
    });

    window.ZhitengBridge = {
      registerModel(layer, url) {
        modelUrls.set(layer, url);
        if (visibleLayers.has(layer)) loadLayer(layer);
      },
      // Registering a local URL never reads it. Flutter calls this only after
      // the skin's first frame; organ is intentionally never in that queue.
      preloadLayer(layer) {
        return layer === 'region' ? loadSurfaceRegions() : loadLayer(layer);
      },
      setModelVersion(version) {
        if (version) modelVersion = String(version);
      },
      // History snapshots use #2f2f2f in dark mode. The canvas stays clear so
      // this page background is the stage the model sits on.
      setStageBackground(color) {
        const next = color || '#fcfcfc';
        const dark = String(next).toLowerCase() !== '#fcfcfc';
        if (window.applyStageChrome) window.applyStageChrome(dark);
        const root = document.documentElement;
        root.style.setProperty('--stage-color', next);
        root.style.backgroundColor = next;
        if (document.body) document.body.style.backgroundColor = next;
      },
      // Comma-separated or array of layer ids to show under the skin.
      setLayers(layers) {
        const list = Array.isArray(layers) ? layers : String(layers || '').split(',').map((s) => s.trim()).filter(Boolean);
        return applyLayers(list);
      },
      // Back-compat: a single layer id behaves like "skin + that layer".
      setLayer(layer) { return applyLayers([layer || 'skin']); },
      // 'all' | 'heart' | 'lung' | 'hepatobiliary' | 'digestive' | 'urinary'.
      // Non-selected groups are dimmed by default and can be fully isolated.
      setOrganGroup(group, isolate, focus) {
        return setOrganGroup(String(group || 'all'), !!isolate, focus !== false);
      },
      focusBone() {
        const request = ++cameraRequestId;
        return loadLayer('bone').then(() => request === cameraRequestId &&
          visibleLayers.has('bone') && focusBoneLayer(true));
      },
      setRegion(value, keepDirection) {
        const next = value || 'full';
        const preserve = !!keepDirection || userAdjustedView || !!pendingView;
        // Model-ready and widget rebuilds repeat the current region. That
        // must not pull the camera back to the default front framing.
        if (cameraSettled && next === region && !keepDirection) return;
        cameraRequestId++;
        frameRegion(next, preserve);
      },
      resetView() {
        cameraRequestId++;
        viewAnim = null;
        pendingView = null;
        userAdjustedView = false;
        frameRegion(region, false);
      },
      // 'front' | 'back' | 'left' | 'right' (anatomical sides).
      setView(view) { setView(view); },
      currentView() { return currentView(); },
      // Coordinates are updated synchronously. Saving flushes their final
      // report without blocking the UI on cosmetic surface-mesh sampling.
      flushControls() { return reportMarker('flush', false); },
      // History review can orbit, zoom and open the depth view, but a tap
      // must not move the saved point.
      setPlacementEnabled(on) { placementEnabled = !!on; },
      cameraFrame() {
        const distance = camera.position.distanceTo(controls.target);
        const zoom = fitDistance > 0 && distance > 0 ? fitDistance / distance : 1;
        return {
          zoom: Number(zoom.toFixed(4)),
          distance: Number(distance.toFixed(4)),
          fitDistance: Number(fitDistance.toFixed(4)),
          targetX: Number(controls.target.x.toFixed(4)),
          targetY: Number(controls.target.y.toFixed(4)),
          targetZ: Number(controls.target.z.toFixed(4)),
          view: currentView(),
        };
      },
      controlsState() {
        return {
          ready: roots.has('skin'), layers: [...visibleLayers],
          view: currentView(), region, organGroup: activeOrganGroup,
          markerScale, lineLength, lineAngle,
          marker: marker && marker.visible ? {
            localX: marker.position.x, localY: marker.position.y,
            localZ: marker.position.z, depth: markerDepth,
          } : null,
          surfacePending: surfaceRevision !== surfaceBuiltRevision,
          surfaceBuilds, surfaceRequests: surfaceRevision,
        };
      },
      // Joystick: metres in the screen plane (dx, dy) and saved placement ray (dz).
      nudge(dx, dy, dz) { return nudge(Number(dx) || 0, Number(dy) || 0, Number(dz) || 0); },
      setCrosshair(on) { crosshairOn = !!on; },
      // Keep parsing/preloading while the 2D map covers this WebView, but do
      // not spend GPU time drawing an invisible stage every frame.
      setActive(on) {
        viewerActive = !!on;
        if (viewerActive) reframeIfStageResized();
      },
      setPlacementShields(rects) {
        placementShields = (Array.isArray(rects) ? rects : []).map((rect) => ({
          x: Number(rect && rect.x) || 0,
          y: Number(rect && rect.y) || 0,
          w: Number(rect && rect.w) || 0,
          h: Number(rect && rect.h) || 0,
        })).filter((rect) => rect.w >= 1 && rect.h >= 1);
        layoutPointerShields();
      },
      setStageChrome(top, bottom) {
        const nextTop = Math.max(0, Number(top) || 0);
        const nextBottom = Math.max(0, Number(bottom) || 0);
        if (Math.abs(nextTop - stageTopChrome) < 1 &&
            Math.abs(nextBottom - stageBottomChrome) < 1) return;
        stageTopChrome = nextTop;
        stageBottomChrome = nextBottom;
        placeDepthViewButton();
        layoutPointerShields();
        if (userZoomed) {
          // 点 / 片 / 线 / 放射 only changes the marker. The line control
          // also changes dock height; that must not zoom the model.
          return;
        }
        if (organFocusActive && heldFocusKind === 'bone') {
          // Refit the skeleton into the band that is still visible so it
          // stays in the middle instead of being pushed off the top.
          focusBoneLayer(false);
          return;
        }
        if (organFocusActive) {
          // The dock grew or shrank. Keep the focused organ in the middle
          // of the band that is still visible.
          holdOrganInClearBand();
          return;
        }
        framedViewHeight = 0;
        // A tap or orbit used to freeze the camera, so an expanding dock
        // covered the feet. Reframe into the new band and keep the side.
        frameRegion(region, userAdjustedView || !!pendingView);
      },
      clearMarker() {
        if (marker) marker.visible = false;
        markerDepth = 0;
        markerAvailableDepth = 0;
        lineAnchor = null;
        markerInward = null;
        markerSkinObject = null;
        updateMarkerDepthAppearance();
        updateDepthGuide();
        rebuildSurfaceMark();
        lineSampleCache = null;
      },
      // Marks already saved on this record. They stay on the body while the
      // active marker moves to the next spot.
      setPinnedMarkers(list) { setPinnedMarkers(list); },
      // Put the active marker back on a previously saved 3D coordinate so
      // that spot can be moved again.
      restoreMarker(x, y, z, depth) {
        return restoreMarker(Number(x), Number(y), Number(z), depth == null ? NaN : Number(depth));
      },
      // 'point' | 'area' | 'line' | 'radiate'
      setShape(shape) { setMarkerShape(String(shape || 'point')); },
      // Indicator size multiplier (0.3 .. 4). For a line this is thickness.
      setMarkerScale(scale) { setMarkerScale(scale); },
      // Line arc length, multiple of the 16 cm base.
      setLineLength(length) { setLineLength(length); },
      // Radians around the outward normal. Re-drapes the stroke on the skin.
      setLineAngle(angle) { setLineAngle(angle); },
      // Whole-body zoom: factor > 1 zooms in, < 1 zooms out.
      zoom(factor) { dolly(Number(factor) || 1); }
    };

    // ---- 2D asset export (tooling; never taken by the app at runtime) ----
    // body3d.html?render2d=front|back|left|right draws the default layer
    // stack through an orthographic camera framed exactly like the Blender
    // ortho renders (build_from_zanatomy.render_views: ortho_scale =
    // max(height * 1.08, width * 1.75) over the skin bounds, camera on the
    // view axis through the bounds centre). The 2D map therefore has the
    // same material, lighting and colours as the 3D stage while still lining
    // up with the Blender region masks. Driven by scripts/render_2d_from_viewer.py.
    const RENDER2D_PARAMS = new URLSearchParams(location.search);
    const RENDER2D = RENDER2D_PARAMS.get('render2d');
    const RENDER2D_ANGLE_RAW = RENDER2D_PARAMS.get('render2dAngle');
    const RENDER2D_ANGLE = RENDER2D_ANGLE_RAW === null
      ? Number.NaN
      : Number(RENDER2D_ANGLE_RAW);
    const RENDER2D_DIRECTION = Number.isFinite(RENDER2D_ANGLE)
      ? [
          Math.sin(THREE.MathUtils.degToRad(RENDER2D_ANGLE)),
          0,
          Math.cos(THREE.MathUtils.degToRad(RENDER2D_ANGLE)),
        ]
      : VIEW_DIRECTIONS[RENDER2D];
    const RENDER2D_LAYER_PARAM = RENDER2D_PARAMS.get('render2dLayers');
    const RENDER2D_EXPORT_LAYERS = RENDER2D_LAYER_PARAM
      ? RENDER2D_LAYER_PARAM.split(',').map((layer) => layer.trim()).filter(Boolean)
      : RENDER2D_LAYERS;
    // Relative Flutter asset URLs let WKWebView/Android WebView stream the
    // bundled GLBs directly. No Base64 conversion or multi-megabyte script
    // injection is needed. Registration itself performs no I/O.
    if (!window.ZHITENG_MODEL_URLS) {
      window.ZHITENG_MODEL_URLS = Object.fromEntries(
        ['skin', 'region', 'muscle', 'bone', 'organ'].map(
          (layer) => [layer, `../models/${layer}.glb`]
        )
      );
    }
    if (RENDER2D && RENDER2D_DIRECTION) {
      // Headless Chrome screenshots on the window load event. Keep that event
      // pending with an image whose URL the export server only answers after
      // we have reported the first finished frame via the ready URL.
      const holdUrl = RENDER2D_PARAMS.get('hold');
      const readyUrl = RENDER2D_PARAMS.get('ready');
      if (holdUrl) { const holder = new Image(); holder.src = holdUrl; }
      document.documentElement.style.background = 'transparent';
      document.body.style.background = 'transparent';
      statusEl.style.display = 'none';
      crosshairOn = false;
      controls.enabled = false;
      renderer.setPixelRatio(1);
      window.ZHITENG_ACTIVE_LAYERS = RENDER2D_EXPORT_LAYERS;
      const whenLoaded = () => {
        const skin = roots.get('skin');
        if (!skin) return;
        box.setFromObject(skin);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const width = canvas.clientWidth || 768;
        const height = canvas.clientHeight || 1280;
        const orthoScale = Math.max(size.y * 1.08, size.x * 1.75); // Blender covers the taller side
        const halfH = orthoScale / 2;
        const halfW = halfH * width / height;
        const ortho = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 0.01, 100);
        const direction = RENDER2D_DIRECTION;
        const distance = Math.max(size.length(), 2) * 2.2;
        ortho.position.copy(center).addScaledVector(new THREE.Vector3(direction[0], direction[1], direction[2]), distance);
        ortho.up.set(0, 1, 0);
        ortho.lookAt(center);
        ortho.updateProjectionMatrix();
        ortho.add(key); // same camera-relative key light as the 3D stage
        scene.add(ortho);
        renderCamera = ortho;
        window.ZHITENG_RENDER2D = { view: RENDER2D, orthoScale, size: size.toArray(), center: center.toArray() };
        requestAnimationFrame(() => requestAnimationFrame(() => {
          document.title = 'render2d-ready';
          if (readyUrl) fetch(readyUrl, { cache: 'no-store' }).catch(() => {});
        }));
      };
      window.ZhitengBridge.setLayers = function (layers) {
        return applyLayers(layers).then(whenLoaded);
      };
    }

    Object.entries(window.ZHITENG_MODEL_URLS || {}).forEach(([layer, url]) => {
      window.ZhitengBridge.registerModel(layer, url);
    });
    window.ZhitengBridge.setLayers(window.ZHITENG_ACTIVE_LAYERS || DEFAULT_LAYERS);

    window.addEventListener('resize', resize);
    resize();
    function tick(now) {
      // Even while hidden behind the default 2D locator, draw the one skin
      // frame required to make the 3D-ready milestone truthful.
      if (!viewerActive && !RENDER2D && !skinFirstFramePending) {
        requestAnimationFrame(tick);
        return;
      }
      if (viewerActive || RENDER2D) stepSurfaceMark();
      stepViewAnimation(now || performance.now());
      controls.update();
      const size = renderer.getSize(new THREE.Vector2());
      if (size.x !== canvas.clientWidth || size.y !== canvas.clientHeight) resize();
      updateStageGrid();
      renderer.render(scene, renderCamera);
      if (skinFirstFramePending) {
        skinFirstFramePending = false;
        post('skinFirstFrame', {
          ok: true,
          layer: 'skin',
          bodyModelVersion: modelVersion,
        });
      }
      updateCrosshair();
      // A named-view animation can pass through another canonical direction.
      // Do not report that transient direction to Flutter: it would make the
      // selected view tab flash to an intermediate option during the turn.
      if (frameRoot() && !viewAnim) {
        const view = currentView();
        if (view !== lastView) { lastView = view; post('view', { view }); }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
